name: recommendation-ci

on:
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd src/recommendation
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: |
          cd src/recommendation
          pip install pytest
          pytest

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: pip install ruff

      - name: Python lint
        run: |
          cd src/recommendation
          ruff check .

  docker:
    runs-on: ubuntu-latest
    needs:
      - build
      - code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Push
        uses: docker/build-push-action@v6
        with:
          context: src/recommendation
          file: src/recommendation/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/recommendation:${{ github.run_id }}

  updatek8s:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSIONCONTROL_TOKEN }}

      - name: Update tag in Kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/recommendation:${{ github.run_id }}|" kubernetes/recommendation/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "blessvinsibinp@gmail.com"
          git config --global user.name "Blessvin Sibin"
          git add kubernetes/recommendation/deploy.yaml
          git commit -m "[CI]: Update recommendation-service image tag"
          git push origin HEAD:main